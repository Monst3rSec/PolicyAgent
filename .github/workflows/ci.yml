name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'spec/**'
      - 'src/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'package.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'spec/**'
      - 'src/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'package.json'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show CLI help
        run: node dist/index.js --help

      - name: Show example repo details
        run: node dist/index.js info -d ./examples/minimal-policy-repo
